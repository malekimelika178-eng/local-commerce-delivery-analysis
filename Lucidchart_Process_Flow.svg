<text x="700" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17243d">Local Commerce & Same-Day Delivery — Proposed Workflow</text>
<rect x="40" y="150" width="190" height="100" rx="14" fill="#ffffff" stroke="#3859a6" stroke-width="2"/><text x="135.0" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#17243d">Customer</text><text x="135.0" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Searches products</text><text x="135.0" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">from nearby stores</text><rect x="280" y="150" width="190" height="100" rx="14" fill="#ffffff" stroke="#3859a6" stroke-width="2"/><text x="375.0" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#17243d">Marketplace app</text><text x="375.0" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Checks availability,</text><text x="375.0" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">groups nearby pickups</text><rect x="520" y="150" width="190" height="100" rx="14" fill="#ffffff" stroke="#3859a6" stroke-width="2"/><text x="615.0" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#17243d">Retailer(s)</text><text x="615.0" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Confirm stock and</text><text x="615.0" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">prepare packages</text><rect x="760" y="150" width="190" height="100" rx="14" fill="#ffffff" stroke="#3859a6" stroke-width="2"/><text x="855.0" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#17243d">Delivery matching</text><text x="855.0" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Finds route-compatible</text><text x="855.0" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">partner</text><rect x="1000" y="150" width="190" height="100" rx="14" fill="#ffffff" stroke="#3859a6" stroke-width="2"/><text x="1095.0" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#17243d">Delivery partner</text><text x="1095.0" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Collects ready packages</text><text x="1095.0" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">from grouped stores</text><rect x="1240" y="150" width="130" height="100" rx="14" fill="#ffffff" stroke="#3859a6" stroke-width="2"/><text x="1305.0" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#17243d">Customer</text><text x="1305.0" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Receives</text><text x="1305.0" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">order</text><path d="M230 200 L270 200" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M262 192 L270 200 L262 208" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M470 200 L510 200" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M502 192 L510 200 L502 208" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M710 200 L750 200" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M742 192 L750 200 L742 208" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M950 200 L990 200" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M982 192 L990 200 L982 208" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M1190 200 L1230 200" stroke="#3859a6" stroke-width="3" fill="none"/><path d="M1222 192 L1230 200 L1222 208" stroke="#3859a6" stroke-width="3" fill="none"/><rect x="260" y="330" width="880" height="95" rx="12" fill="#fff5d9" stroke="#d6b65d"/><text x="700" y="365" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#604b16">Core operating rule</text><text x="700" y="395" text-anchor="middle" font-family="Arial" font-size="15" fill="#604b16">Dispatch only after retailer readiness is confirmed; group nearby pickups to limit detours.</text></svg>